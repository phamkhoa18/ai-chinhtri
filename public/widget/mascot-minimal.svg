<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gradient Body -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#991B1B" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    @keyframes waveHand {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-22deg); }
      40% { transform: rotate(18deg); }
      60% { transform: rotate(-18deg); }
      80% { transform: rotate(10deg); }
    }
    @keyframes eyeBlink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    @keyframes antennaGlow {
      0%, 100% { filter: drop-shadow(0 0 2px #FDE047); transform: scale(1); }
      50% { filter: drop-shadow(0 0 8px #FDE047); transform: scale(1.15); }
    }
    .waving-arm {
      transform-origin: 90px 70px;
      animation: waveHand 2.2s ease-in-out infinite;
    }
    .blinking-eyes {
      transform-origin: 55px 56px;
      animation: eyeBlink 4s ease-in-out infinite;
    }
    .antenna-light {
      transform-origin: 55px 16px;
      animation: antennaGlow 2s ease-in-out infinite;
    }
  </style>

  <!-- Drop Shadow Circle Base -->
  <g filter="url(#dropShadow)">
    <!-- Outer Main Glow Pill/Circle -->
    <circle cx="60" cy="60" r="54" fill="url(#bgGrad)" />
    <!-- Golden Border Ring -->
    <circle cx="60" cy="60" r="52" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.85" />
  </g>

  <!-- Antenna -->
  <g>
    <path d="M55 26 L55 17" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <circle class="antenna-light" cx="55" cy="15" r="5" fill="#FDE047" />
  </g>

  <!-- Robot Head / Face Screen -->
  <g>
    <!-- Screen Bezel -->
    <rect x="22" y="28" width="66" height="56" rx="22" fill="url(#screenGrad)" stroke="#334155" stroke-width="2" />
    <!-- Glass Gloss Reflection -->
    <rect x="24" y="30" width="62" height="26" rx="16" fill="url(#glassGloss)" />
    
    <!-- Cute LED Eyes (Happy Arcs) -->
    <g class="blinking-eyes">
      <!-- Left Eye -->
      <path d="M36 56 Q44 46 50 56" fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
      <!-- Right Eye -->
      <path d="M60 56 Q66 46 74 56" fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
      <!-- Cute Blushing Cheeks -->
      <ellipse cx="34" cy="62" rx="4" ry="2.5" fill="#F43F5E" opacity="0.8" />
      <ellipse cx="76" cy="62" rx="4" ry="2.5" fill="#F43F5E" opacity="0.8" />
      <!-- Cute Smile Dot/Line -->
      <path d="M52 64 Q55 67 58 64" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Little Golden Star Badge at bottom left of robot -->
  <path d="M30 90 L32.5 95 L38 96 L34 100 L35 105.5 L30 102.5 L25 105.5 L26 100 L22 96 L27.5 95 Z" fill="url(#goldGrad)" />

  <!-- Waving Robotic Arm (Right side, friendly greeting) -->
  <g class="waving-arm">
    <!-- Arm shoulder & limb -->
    <path d="M82 62 Q92 56 96 42" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <!-- Hand Palm -->
    <circle cx="97" cy="40" r="7.5" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Waving Fingers -->
    <path d="M94 33 L93 27" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M97 33 L98 25" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M101 35 L104 28" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Little Sparkle Star -->
  <g transform="translate(100, 16) scale(0.65)">
    <path d="M10 0 Q10 10 20 10 Q10 10 10 20 Q10 10 0 10 Q10 10 10 0 Z" fill="#FDE047" filter="url(#glow)" />
  </g>
</svg>
